name: Aggiorna prezzi (dati.json)

on:
  schedule:
    - cron: "0 22 * * *"   # ogni giorno alle 22:00 UTC
  workflow_dispatch:        # esecuzione manuale dal tab Actions

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Esegui script di aggiornamento
        run: python .github/scripts/aggiorna_dati.py

      - name: Committa se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dati.json; then
            git add dati.json
            git commit -m "chore: aggiornamento prezzi automatico ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "dati.json aggiornato e pushato"
          else
            echo "nessuna variazione: niente commit"
          fi